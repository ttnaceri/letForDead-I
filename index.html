<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let For Dead I</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Orqa fondagi video */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .menu-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Tepadagi logotip */
        .logo-container {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
        }

        .logo-container img {
            max-width: 450px;
            width: 50vw;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.9));
        }

        /* Pastdagi menyu tugmalari - rasmga yaqinroq */
        .menu-buttons {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Chapga tekislash, rasmda shunga o'xshash */
            gap: 4px;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            padding-left: 50px; /* Chetdan bir oz masofa */
        }

        .menu-btn {
            background: transparent;
            color: #dcdcdc;
            border: none;
            padding: 8px 12px;
            font-size: 22px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            width: fit-content;
            font-family: 'Arial Narrow', 'Arial', sans-serif;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .menu-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            padding-left: 20px; /* Hoverda siljish effekti */
        }

        .menu-btn:active {
            color: #ff4444;
        }

        @media (max-width: 768px) {
            .logo-container img {
                width: 70vw;
                max-width: 300px;
            }
            .menu-btn {
                font-size: 18px;
            }
            .menu-buttons {
                padding-left: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Orqa fondagi video -->
    <video id="bg-video" autoplay loop playsinline>
        <source src="image/bg.mp4" type="video/mp4">
    </video>

    <div class="menu-container">
        <!-- Tepadagi logotip -->
        <div class="logo-container">
        </div>

        <!-- Menyu tugmalari -->
        <div class="menu-buttons">
            <button class="menu-btn" onclick="start()">Кампания</button>
            <button class="menu-btn">Сетевая игра</button>
            <button class="menu-btn">Одиночная игра</button>
            <button class="menu-btn">Достижения</button>
            <button class="menu-btn">Настройки</button>
            <button class="menu-btn">Дополнения</button>
            <button class="menu-btn">Выход</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('bg-video');
            video.play().catch(function(error) {
                console.log("Video autoplay xatosi:", error);
            });
        });
        function start() {
            window.location.href = "game.html"
        }
    </script>

</body>
</html>
