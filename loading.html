<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d0b0a" />
<title>Loading... — Let For Dead</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#0d0b0a;
    color:#d8d1c2;
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Courier New', monospace;
  }

  #loading-container {
    position:relative;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background: radial-gradient(ellipse at center, #17130f 0%, #0d0b0a 70%, #000 100%);
  }

  #loading-container::after {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:4px;
    background: linear-gradient(90deg, transparent, #a32f22, #e0523c, #a32f22, transparent);
    animation: pulseStripe 2s ease-in-out infinite;
  }
  @keyframes pulseStripe {
    0%,100% { opacity:0.5; }
    50% { opacity:1; }
  }

  .loading-title {
    font-family:'Staatliches', 'Arial Narrow', sans-serif;
    font-size: clamp(48px, 10vw, 96px);
    letter-spacing: 12px;
    color: #d8d1c2;
    text-shadow: 3px 0 0 #a32f22, -2px 0 0 rgba(107,143,63,0.5), 0 0 40px rgba(163,47,34,0.6);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .loading-sub {
    font-size: clamp(12px, 2vw, 16px);
    letter-spacing: 6px;
    color: #c98a2e;
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .progress-container {
    width: 80%;
    max-width: 500px;
    margin-bottom: 16px;
  }

  .progress-outer {
    width:100%;
    height:24px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #2a2418;
    border-radius: 4px;
    overflow:hidden;
  }

  .progress-inner {
    height:100%;
    width:0%;
    background: linear-gradient(90deg, #6b8f3f, #c98a2e, #e0523c);
    transition: width 0.15s ease;
  }

  .progress-text {
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #837b6d;
    text-transform: uppercase;
  }

  .progress-percent {
    color: #c98a2e;
    font-weight: 700;
  }

  .loading-message {
    margin-top: 20px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #837b6d;
    text-transform: uppercase;
    min-height: 20px;
  }

  .status-grid {
    margin-top: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 24px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #5a5448;
    text-transform: uppercase;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #5a5448;
    transition: background 0.3s ease;
  }

  .status-dot.ok { background: #7ad44a; }
  .status-dot.error { background: #e0523c; }
</style>
</head>
<body>

<div id="loading-container">
  <div class="loading-title">LET FOR DEAD</div>
  <div class="loading-sub">Preparing the outbreak</div>

  <div class="progress-container">
    <div class="progress-outer">
      <div class="progress-inner" id="progressInner"></div>
    </div>
    <div class="progress-text">
      <span>Loading</span>
      <span class="progress-percent" id="progressPercent">0%</span>
    </div>
  </div>

  <div class="loading-message" id="loadingMessage">Initializing...</div>
  <div class="status-grid" id="statusGrid"></div>
</div>

<script>
(function(){
'use strict';

var NEXT_PAGE = 'game.html';

var MODULES = [
  'lang.js',
  'save.js',
  'audio.js',
  'music.js',
  'world.js',
  'weapons.js',
  'zombies.js',
  'items.js',
  'ai.js',
  'player.js',
  'help.js',
  'plane.js',
  'missions.js',
  'hud-config.js',
  'hud.js',
  'controller.js'
];

var progressInner = document.getElementById('progressInner');
var progressPercent = document.getElementById('progressPercent');
var loadingMessage = document.getElementById('loadingMessage');
var statusGrid = document.getElementById('statusGrid');

var totalSteps = MODULES.length + 2;
var currentStep = 0;
var loadedModules = {};
var errors = [];

function setProgress(pct){
  pct = Math.min(100, Math.max(0, pct));
  if(progressInner) progressInner.style.width = pct + '%';
  if(progressPercent) progressPercent.textContent = Math.round(pct) + '%';
}

function setMessage(msg){
  if(loadingMessage) loadingMessage.textContent = msg;
}

function updateStep(){
  currentStep++;
  setProgress((currentStep / totalSteps) * 100);
}

function buildStatusGrid(){
  if(!statusGrid) return;
  statusGrid.innerHTML = '';
  MODULES.forEach(function(mod){
    var item = document.createElement('div');
    item.className = 'status-item';

    var dot = document.createElement('div');
    dot.className = 'status-dot';
    dot.id = 'dot_' + mod.replace('.', '_');

    var label = document.createElement('span');
    label.textContent = mod.replace('.js', '');

    item.appendChild(dot);
    item.appendChild(label);
    statusGrid.appendChild(item);
  });
}

function markModule(mod, ok){
  var dot = document.getElementById('dot_' + mod.replace('.', '_'));
  if(!dot) return;
  dot.classList.remove('ok', 'error');
  dot.classList.add(ok ? 'ok' : 'error');
}

function loadModule(url){
  return new Promise(function(resolve){
    var script = document.createElement('script');
    script.src = url;
    script.async = false;

    var resolved = false;
    function finish(status){
      if(resolved) return;
      resolved = true;
      loadedModules[url] = (status === 'ok');
      markModule(url, status === 'ok');
      updateStep();
      if(status !== 'ok'){
        errors.push(url);
        console.warn('[Loading] Failed:', url);
      }
      resolve();
    }

    script.onload = function(){ finish('ok'); };
    script.onerror = function(){ finish('error'); };
    setTimeout(function(){ finish('error'); }, 3000);

    document.head.appendChild(script);
  });
}

async function loadAll(){
  for(var i = 0; i < MODULES.length; i++){
    setMessage('Loading ' + MODULES[i].replace('.js', '') + '...');
    await loadModule(MODULES[i]);
  }

  setMessage('Initializing audio...');
  try {
    if(window.SFX && window.SFX.ensureAudio) window.SFX.ensureAudio();
  } catch(e){}
  updateStep();

  setMessage('Loading map...');
  try {
    if(window.World && window.World.loadActiveMap) window.World.loadActiveMap();
  } catch(e){}
  updateStep();
}

var done = false;
var startTime = Date.now();
var MIN_TIME = 1500;

function startGame(){
  if(done) return;
  done = true;
  var elapsed = Date.now() - startTime;
  var wait = Math.max(0, MIN_TIME - elapsed);

  setTimeout(function(){
    setProgress(100);
    setMessage('Starting...');
    if(errors.length > 0) console.warn('[Loading] Errors:', errors);
    window.location.href = NEXT_PAGE;
  }, wait);
}

setProgress(0);
setMessage('Initializing...');
buildStatusGrid();

loadAll().then(function(){
  setMessage('Ready!');
  startGame();
}).catch(function(err){
  console.warn('[Loading] Catch:', err);
  startGame();
});

setTimeout(function(){
  if(!done){
    console.warn('[Loading] Timeout');
    startGame();
  }
}, 10000);

})();
</script>
</body>
</html>
